name: Node Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Find Termux node binary for aarch64
        run: |
          set -x
          curl -sL https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages.xz -o /tmp/P.xz || true
          ls -l /tmp/P.xz || true
          xz -dc /tmp/P.xz > /tmp/P.txt 2>/dev/null || true
          echo "=== node 相关包 ==="
          grep -A3 -E "^Package: nodejs" /tmp/P.txt | grep -E "^Package:|^Version:|^Filename:|^Size:" | head -30
