name: Node Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect nodejs-mobile-cordova npm tarball
        run: |
          set -x
          URL=$(curl -s https://registry.npmjs.org/nodejs-mobile-cordova/latest | python3 -c "import json,sys; print(json.load(sys.stdin)['dist']['tarball'])")
          echo "TARBALL=$URL"
          curl -sL "$URL" -o /tmp/n.tgz
          ls -l /tmp/n.tgz
          tar -tzf /tmp/n.tgz | grep -E "libnode|\.so$|include/node/node\.h" | head -20
          echo "--- 总文件数 ---"
          tar -tzf /tmp/n.tgz | wc -l
      - name: Inspect nodejs-mobile-react-native npm tarball
        run: |
          set -x
          URL=$(curl -s https://registry.npmjs.org/nodejs-mobile-react-native/latest | python3 -c "import json,sys; print(json.load(sys.stdin)['dist']['tarball'])")
          curl -sL "$URL" -o /tmp/m.tgz
          ls -l /tmp/m.tgz
          tar -tzf /tmp/m.tgz | grep -E "libnode|\.so$|\.aar$" | head -20
