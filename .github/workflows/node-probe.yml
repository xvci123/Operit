name: Node Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List react-native android tree (non-headers)
        run: |
          set -x
          URL=$(curl -s https://registry.npmjs.org/nodejs-mobile-react-native/latest | python3 -c "import json,sys;print(json.load(sys.stdin)['dist']['tarball'])")
          curl -sL "$URL" -o /tmp/m.tgz
          echo "=== android/ 非头文件 ==="
          tar -tzf /tmp/m.tgz | grep "^package/android/" | grep -v "libnode/include" | head -40
          echo "=== 任何 .aar/.so/.jar ==="
          tar -tzf /tmp/m.tgz | grep -Ei "\.aar$|\.jar$|\.so$" | head -20
