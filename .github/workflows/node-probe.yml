name: Node Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Dump native-lib.cpp and node::Start signature
        run: |
          URL=$(curl -s https://registry.npmjs.org/nodejs-mobile-react-native/latest | python3 -c "import json,sys;print(json.load(sys.stdin)['dist']['tarball'])")
          curl -sL "$URL" -o /tmp/m.tgz; mkdir -p /tmp/u; tar -xzf /tmp/m.tgz -C /tmp/u
          echo "=== native-lib.cpp 全文 ==="
          cat /tmp/u/package/android/src/main/cpp/native-lib.cpp
          echo "=== node.h 里的 Start / platform 声明 ==="
          grep -nE "Start\(|MultiIsolatePlatform|InitializeOncePerProcess|node::Start" /tmp/u/package/android/libnode/include/node/node.h | head -12
