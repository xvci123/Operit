name: Node Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List termux node pool dir
        run: |
          for U in \
            "https://packages.termux.dev/apt/termux-main/pool/main/n/nodejs/" \
            "https://mirrors.tuna.tsinghua.edu.cn/termux/apt/termux-main/pool/main/n/nodejs/" \
            "https://mirrors.ustc.edu.cn/termux/apt/termux-main/pool/main/n/nodejs/" ; do
            echo "=== $U"
            curl -sL --max-time 25 "$U" | grep -oE 'href="[^"]*aarch64\.deb"' | head -8
            curl -sL --max-time 25 "$U" | grep -oE 'nodejs[^"<> ]*aarch64\.deb' | sort -u | head -8
          done
