name: Node Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download termux node and inspect
        run: |
          set -x
          curl -sL -o /tmp/node.deb "https://mirrors.tuna.tsinghua.edu.cn/termux/apt/termux-main/pool/main/n/nodejs/nodejs_26.13.1_aarch64.deb"
          ls -l /tmp/node.deb
          dpkg-deb -x /tmp/node.deb /tmp/nx
          find /tmp/nx -type f | head -20
          BIN=$(find /tmp/nx -path "*bin/node" | head -1)
          echo "BIN=$BIN"
          ls -l "$BIN"
          file "$BIN" || true
          echo "=== NEEDED 库 ==="
          readelf -d "$BIN" | grep NEEDED || true
