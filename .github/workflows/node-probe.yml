name: Node Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe mirrors for termux Packages index
        run: |
          for U in \
            "https://mirrors.tuna.tsinghua.edu.cn/termux/apt/termux-main/dists/stable/main/binary-aarch64/Packages.xz" \
            "https://mirrors.ustc.edu.cn/termux/apt/termux-main/dists/stable/main/binary-aarch64/Packages.xz" \
            "https://mirror.sjtu.edu.cn/termux/apt/termux-main/dists/stable/main/binary-aarch64/Packages.xz" \
            "https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages.xz" ; do
            S=$(curl -sL -o /tmp/t.xz -w '%{http_code} %{size_download}' "$U")
            echo "TRY $S $U"
            if [ "$(stat -c%s /tmp/t.xz 2>/dev/null || echo 0)" -gt 100000 ]; then
              echo "OK using $U"
              xz -dc /tmp/t.xz > /tmp/P.txt
              grep -B1 -A6 '^Package: nodejs' /tmp/P.txt | head -24
              break
            fi
          done
