name: Node Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List termux pool dirs
        run: |
          B="https://mirrors.tuna.tsinghua.edu.cn/termux/apt/termux-main/pool/main"
          for d in s l; do
            echo "=== pool/main/$d （含 sqlite / ffi 的目录）"
            curl -sL --max-time 25 "$B/$d/" | grep -oE 'href="[^"]*"' | grep -iE 'sqlite|ffi' | head -10
          done
