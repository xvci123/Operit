name: Node Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Dump required JNI callbacks
        run: |
          URL=$(curl -s https://registry.npmjs.org/nodejs-mobile-react-native/latest | python3 -c "import json,sys;print(json.load(sys.stdin)['dist']['tarball'])")
          curl -sL "$URL" -o /tmp/m.tgz; mkdir -p /tmp/u; tar -xzf /tmp/m.tgz -C /tmp/u
          echo "=== JNI 导出的 Java 方法（引擎会回调这些）==="
          grep -rhoE "Java_[A-Za-z0-9_]+" /tmp/u/package/android/src/main/cpp | sort -u
          echo "=== native-lib.cpp 里的关键调用 ==="
          grep -nE "GetJavaVM|AttachCurrentThread|CallVoidMethod|GetMethodID|node::Start|StartNode" /tmp/u/package/android/src/main/cpp/*.cpp | head -20
