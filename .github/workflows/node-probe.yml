name: Node Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Dump shim + cmake + any prebuilt native lib
        run: |
          set -e
          URL=$(curl -s https://registry.npmjs.org/nodejs-mobile-cordova/latest | python3 -c "import json,sys; print(json.load(sys.stdin)['dist']['tarball'])")
          curl -sL "$URL" -o /tmp/n.tgz
          mkdir -p /tmp/u && tar -xzf /tmp/n.tgz -C /tmp/u
          echo "=== 全部 .so（含 shim?） ==="
          tar -tzf /tmp/n.tgz | grep -i "\.so" | head -20
          echo "=== CMakeLists.txt 全文 ==="
          cat /tmp/u/package/src/android/CMakeLists.txt
          echo "=== native-lib.cpp 头 60 行 ==="
          head -60 /tmp/u/package/src/android/jni/native-lib.cpp
          echo "=== node 头文件目录 ==="
          ls /tmp/u/package/libs/android/libnode/include/node | head -8
