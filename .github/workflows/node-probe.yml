name: Node Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Try termux mirrors for Packages index
        run: |
          for U in \
            "https://packages-cf.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages.xz" \
            "https://mirror.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages.xz" \
            "https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages" \
            "https://raw.githubusercontent.com/termux/termux-packages/master/packages/nodejs-lts/build.sh" ; do
            C=$(curl -sIL -o /dev/null -w '%{http_code} %{size_download}' "$U")
            echo "$C  $U"
          done
          echo "=== 试 index ==="
          curl -sL "https://packages-cf.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages.xz" -o /tmp/P.xz
          ls -l /tmp/P.xz; xz -dc /tmp/P.xz > /tmp/P.txt 2>/dev/null; wc -l /tmp/P.txt
          grep -B1 -A6 "^Package: nodejs" /tmp/P.txt | head -40
