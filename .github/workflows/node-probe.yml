name: Node Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: grep index for sqlite/ffi packages
        run: |
          curl -sL -o /tmp/idx.gz "https://mirrors.tuna.tsinghua.edu.cn/termux/apt/termux-main/dists/stable/main/binary-aarch64/Packages.gz"
          gunzip -c /tmp/idx.gz > /tmp/idx.txt
          echo "=== 含 sqlite 的包名"; grep -a "^Package: .*sqlite" /tmp/idx.txt | sort -u
          echo "=== 含 ffi 的包名"; grep -a "^Package: .*ffi" /tmp/idx.txt | sort -u
          echo "=== libffi 的 Filename"; grep -a -A12 "^Package: libffi$" /tmp/idx.txt | grep -aE "^Package|^Version|^Filename|^Size" | head -6
          echo "=== libsqlite 的 Filename"; grep -a -A12 "^Package: libsqlite$" /tmp/idx.txt | grep -aE "^Package|^Version|^Filename|^Size" | head -6
